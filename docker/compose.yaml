# compose.yaml — the two-node meta-community topology (owner: compose-topology).
#
# WHAT THIS IS. Two containers of the SAME image, differing only in NODE_ID and PEER_URL, on ONE
# user-defined network so the peer URL can be the compose SERVICE NAME (`http://node-b:8090`).
# The service-name DNS is not assumed here — it is MEASURED from inside node-a at acceptance step 3,
# because a name that only resolves on the host would make the two-node consensus silently single-node.
#
# WHY EVERY HARDENING LINE IS HERE. The owner's requirement is that no data of the user shall be
# provably saved. At the platform layer that means: the container has NO writable place to keep
# anything but a 1 MiB /tmp, NO capability to change that, NO volume that would outlive it, and NO
# log that could grow into a store. Each line below carries the reason beside it, because a hardening
# flag with no stated reason is the first one a later editor deletes.
#
# WHAT THIS FILE CANNOT PROVE. Read-only rootfs and dropped capabilities are properties of the
# CONTAINER CONFIG; that they actually hold is measured in the running container
# (`docker exec node-a sh -c 'touch /probe'` must fail) and reviewed independently by security-review.
# This file is the claim; the harnesses are the proof.

# Stable project name so `docker compose ps`, `docker volume ls --filter` and `docker inspect` all
# address the same stack from any working directory (a path-derived project name changes with cwd).
name: meta-community

services:
  # ---- node-a -----------------------------------------------------------------------------------
  node-a:
    image: metateam/meta-community-node:local
    container_name: meta-community-node-a
    # The container's own name is fixed so the harness lanes can `docker exec meta-community-node-a`
    # without first having to resolve a compose-generated name.
    environment:
      # NODE_ID is required and non-empty; the process REFUSES TO START without it (NODE-CONTRACT §config).
      # It is set here and not in nodes.env because the two services must differ on exactly this value.
      NODE_ID: "node-a"
      # PEER_URL is the OTHER service by compose SERVICE NAME on the shared user-defined network.
      # The peer needs no credential: node-to-node endorsement is unauthenticated by design and the
      # whole link is inside one private docker network that publishes nothing to the host.
      PEER_URL: "http://node-b:8090"
    # Shared, non-differing values live in nodes.env so PORT/SNAPSHOT_DIR/timeouts cannot drift
    # between the two nodes. Path is relative to THIS file's directory (docker/), and it contains no
    # secret — see the header of nodes.env.
    env_file:
      - nodes.env
    # Host publishing is bound to LOOPBACK ONLY. The harness lanes drive 127.0.0.1:18091/18092, and
    # binding 0.0.0.0 would place an unauthenticated node surface on every host interface for no gain.
    ports:
      - "127.0.0.1:18091:8090"
    # Runs as the image's fixed non-root uid/gid 10001. Stated explicitly rather than inherited so a
    # later base-image change cannot silently start this service as root: compose overrides the image.
    user: "10001:10001"
    # The whole root filesystem is read-only: the node has nowhere to write a payload, a session
    # record or a cache even if a future bug tried to. This is the platform-layer half of anonymity.
    read_only: true
    # The ONE writable path, and it is memory-backed, size-capped, non-executable and nosuid:
    # node needs a real /tmp for its own scratch (measured — acceptance records whether anything
    # beyond /tmp is genuinely required, and nothing is added here by guesswork).
    # noexec stops a dropped payload from becoming an executable; nosuid stops a setuid bit from mattering;
    # size=1m caps how much could ever be written, so the path cannot become a store.
    tmpfs:
      - /tmp:size=1m,noexec,nosuid
    # ALL Linux capabilities dropped. The node binds one unprivileged port and opens one socket; it
    # needs none of CAP_NET_BIND_SERVICE, CAP_CHOWN or CAP_DAC_OVERRIDE, and holding none means a
    # compromised process cannot change its own confinement.
    cap_drop:
      - ALL
    # No privilege escalation is possible even if a file inside the image were setuid: the kernel
    # refuses the transition outright.
    security_opt:
      - no-new-privileges:true
    # Logs are capped at 1 MiB total with no rotation history: a log file is a place where a request
    # body could survive, and a capped log cannot become a growing store of it.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    # Health is the compose service's job (the image deliberately carries no HEALTHCHECK): node's OWN
    # fetch, because the image has no curl. Exit 0 only on a 2xx; a non-2xx or a refused connection is
    # a failure, and a timeout is a failure — an unanswered probe is never healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/node/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 5
      # A cold start must not be counted as a failure: the grace window is one full check cycle.
      start_period: 5s
    # The shared user-defined network is what makes `node-b` resolve to node-a's peer. Joined by every
    # service below and by no other stack.
    networks:
      - meta-community-net

  # ---- node-b -----------------------------------------------------------------------------------
  # Identical image, identical hardening, mirror-image identity. The two must differ in NODE_ID and
  # PEER_URL and in NOTHING else, or a consensus run would be comparing two different systems.
  node-b:
    image: metateam/meta-community-node:local
    container_name: meta-community-node-b
    environment:
      NODE_ID: "node-b"
      # The mirror of node-a's link: the peer is addressed by SERVICE NAME, on the internal port.
      PEER_URL: "http://node-a:8090"
    env_file:
      - nodes.env
    # The second host port, also loopback-only.
    ports:
      - "127.0.0.1:18092:8090"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=1m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/node/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    networks:
      - meta-community-net

# A USER-DEFINED network, not the default bridge, because Docker only provides embedded service-name
# DNS on user-defined networks — and the peer URL is a service name. The subnet is left to Docker so no
# fixed range can collide with the host or with the plane-* containers this build must not touch.
networks:
  meta-community-net:
    driver: bridge
    # `internal: true` is deliberately NOT set. It would cut the nodes off from outside egress, which
    # looks like a gain, but it is not guaranteed to keep the host-published loopback ports
    # (127.0.0.1:18091/18092) working, and those ports are what three harness lanes drive. Containment
    # is therefore claimed where it is measured — read_only, cap_drop ALL, no volumes, no bind mounts,
    # a 1 MiB tmpfs and a capped log — rather than on a network flag whose side effect on publishing
    # would itself need measuring before it could be relied on.

# NO `volumes:` SECTION, INTENTIONALLY. A named volume is a durable, inspectable store that outlives
# the container, so declaring one here would contradict the anonymity claim at the platform layer.
# Likewise there is no bind mount of any host folder — a host path would let a payload land on the
# user's own disk. The only writable path in either container is the 1 MiB tmpfs /tmp above.
